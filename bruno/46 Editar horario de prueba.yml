info:
  name: "Editar horario de prueba"
  type: "http"
  seq: 46
http:
  method: "PUT"
  url: "https://situa.oaxacoders.tech/api/tutor/horarios/{{horario_prueba}}"
  body:
    type: "json"
    data: |-
      {
        "inicioEn": "{{inicio_horario}}",
        "finEn": "{{fin_horario}}",
        "ubicacion": "Aula editada Bruno {{marca}}"
      }
  auth:
    type: "bearer"
    token: "{{token_tutor}}"
runtime:
  scripts:
    - type: "tests"
      code: |-
        test("Responde HTTP 200", function () {
          expect(res.status).to.equal(200);
        });
        test("Guarda la ubicación nueva", function () { expect(res.body.ubicacion).to.include("Aula editada Bruno"); });
settings:
  encodeUrl: true
  timeout: 30000
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
