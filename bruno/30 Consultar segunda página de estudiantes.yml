info:
  name: "Consultar segunda página de estudiantes"
  type: "http"
  seq: 30
http:
  method: "GET"
  url: "https://situa.oaxacoders.tech/api/coordinacion/estudiantes?pagina=2&tamano=5"
  auth:
    type: "bearer"
    token: "{{token_coordinacion}}"
runtime:
  scripts:
    - type: "tests"
      code: |-
        test("Responde HTTP 200", function () {
          expect(res.status).to.equal(200);
        });
        test("La página viene del servidor", function () {
          expect(res.body.contenido).to.be.an("array");
          expect(res.body.pagina).to.be.a("number");
          expect(res.body.totalRegistros).to.be.a("number");
          expect(res.body.totalPaginas).to.be.a("number");
        });
        test("Devuelve la segunda página", function () { expect(res.body.pagina).to.equal(2); });
settings:
  encodeUrl: true
  timeout: 30000
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
