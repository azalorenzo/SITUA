info:
  name: "Recibir aviso en estudiante"
  type: "http"
  seq: 68
http:
  method: "GET"
  url: "https://situa.oaxacoders.tech/api/estudiante/avisos?pagina=1&tamano=100"
  auth:
    type: "bearer"
    token: "{{token_estudiante}}"
runtime:
  scripts:
    - type: "tests"
      code: |-
        test("Responde HTTP 200", function () {
          expect(res.status).to.equal(200);
        });
        test("El estudiante recibe el mismo aviso", function () { expect(res.body.contenido.some(aviso => aviso.id === bru.getVar("aviso_prueba"))).to.equal(true); });
settings:
  encodeUrl: true
  timeout: 30000
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
