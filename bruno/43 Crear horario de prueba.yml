info:
  name: "Crear horario de prueba"
  type: "http"
  seq: 43
http:
  method: "POST"
  url: "https://situa.oaxacoders.tech/api/tutor/horarios"
  body:
    type: "json"
    data: |-
      {
        "inicioEn": "{{inicio_horario}}",
        "finEn": "{{fin_horario}}",
        "ubicacion": "Aula Bruno {{marca}}"
      }
  auth:
    type: "bearer"
    token: "{{token_tutor}}"
runtime:
  scripts:
    - type: "after-response"
      code: |-
        if (res.status === 201) { bru.setVar("horario_prueba", res.body.id); }
    - type: "tests"
      code: |-
        test("Responde HTTP 201", function () {
          expect(res.status).to.equal(201);
        });
settings:
  encodeUrl: true
  timeout: 30000
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
