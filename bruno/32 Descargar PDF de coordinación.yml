info:
  name: "Descargar PDF de coordinación"
  type: "http"
  seq: 32
http:
  method: "GET"
  url: "https://situa.oaxacoders.tech/api/coordinacion/reportes/exportar/pdf"
  auth:
    type: "bearer"
    token: "{{token_coordinacion}}"
runtime:
  scripts:
    - type: "tests"
      code: |-
        test("Responde HTTP 200", function () {
          expect(res.status).to.equal(200);
        });
        test("Devuelve un archivo PDF", function () { expect(res.headers["content-type"]).to.include("application/pdf"); });
settings:
  encodeUrl: true
  timeout: 30000
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
