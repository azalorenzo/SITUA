info:
  name: "Rechazar token inválido"
  type: "http"
  seq: 13
http:
  method: "GET"
  url: "https://situa.oaxacoders.tech/api/autenticacion/sesion"
  auth:
    type: "bearer"
    token: "{{token_invalido}}"
runtime:
  scripts:
    - type: "before-request"
      code: |-
        bru.setVar("token_invalido", "token-invalido");
    - type: "tests"
      code: |-
        test("Responde HTTP 401", function () {
          expect(res.status).to.equal(401);
        });
settings:
  encodeUrl: true
  timeout: 30000
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
