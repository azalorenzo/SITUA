info:
  name: "Eliminar horario de prueba"
  type: "http"
  seq: 48
http:
  method: "DELETE"
  url: "https://situa.oaxacoders.tech/api/tutor/horarios/{{horario_prueba}}"
  auth:
    type: "bearer"
    token: "{{token_tutor}}"
runtime:
  scripts:
    - type: "tests"
      code: |-
        test("Responde HTTP 200", function () {
          expect(res.status).to.equal(200);
        });
        test("Confirma la eliminación", function () { expect(res.body.eliminado).to.equal(true); });
settings:
  encodeUrl: true
  timeout: 30000
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
