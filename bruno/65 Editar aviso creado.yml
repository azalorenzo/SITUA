info:
  name: "Editar aviso creado"
  type: "http"
  seq: 65
http:
  method: "PUT"
  url: "https://situa.oaxacoders.tech/api/coordinacion/avisos/{{aviso_prueba}}"
  body:
    type: "json"
    data: |-
      {
        "titulo": "{{titulo_aviso}}",
        "descripcion": "Aviso editado por Bruno",
        "categoria": "general",
        "prioridad": "normal",
        "destinatarios": "conservar",
        "usuarioIds": []
      }
  auth:
    type: "bearer"
    token: "{{token_coordinacion}}"
runtime:
  scripts:
    - type: "tests"
      code: |-
        test("Responde HTTP 200", function () {
          expect(res.status).to.equal(200);
        });
settings:
  encodeUrl: true
  timeout: 30000
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
