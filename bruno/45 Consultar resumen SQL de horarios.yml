info:
  name: "Consultar resumen SQL de horarios"
  type: "http"
  seq: 45
http:
  method: "GET"
  url: "https://situa.oaxacoders.tech/api/tutor/horarios/resumen?desde={{desde_horarios}}&hasta={{hasta_horarios}}"
  auth:
    type: "bearer"
    token: "{{token_tutor}}"
runtime:
  scripts:
    - type: "tests"
      code: |-
        test("Responde HTTP 200", function () {
          expect(res.status).to.equal(200);
        });
        test("Calcula los contadores", function () { expect(res.body.total).to.be.at.least(1); expect(res.body.disponibles).to.be.a("number"); });
settings:
  encodeUrl: true
  timeout: 30000
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
