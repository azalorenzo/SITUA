info:
  name: "Consultar tutorados paginados"
  type: "http"
  seq: 34
http:
  method: "GET"
  url: "https://situa.oaxacoders.tech/api/tutor/estudiantes/pagina?pagina=1&tamano=5"
  auth:
    type: "bearer"
    token: "{{token_tutor}}"
runtime:
  scripts:
    - type: "after-response"
      code: |-
        if (res.status === 200 && res.body.contenido.length) { bru.setVar("estudiante_tutorado", res.body.contenido[0].id); }
    - type: "tests"
      code: |-
        test("Responde HTTP 200", function () {
          expect(res.status).to.equal(200);
        });
        test("La página viene del servidor", function () {
          expect(res.body.contenido).to.be.an("array");
          expect(res.body.pagina).to.be.a("number");
          expect(res.body.totalRegistros).to.be.a("number");
          expect(res.body.totalPaginas).to.be.a("number");
        });
settings:
  encodeUrl: true
  timeout: 30000
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
