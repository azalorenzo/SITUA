spring.application.name=backend

# Tomamos los datos locales sin guardar contraseñas en este archivo.
spring.config.import=optional:file:.env[.properties],optional:file:backend/.env[.properties]

spring.datasource.url=jdbc:mysql://${BD_SERVIDOR:127.0.0.1}:${BD_PUERTO:3306}/${BD_NOMBRE:tutoria}?connectionTimeZone=UTC&forceConnectionTimeZoneToSession=true
spring.datasource.username=${BD_USUARIO}
spring.datasource.password=${BD_CONTRASENA}

# Las tablas ya existen y no queremos que Hibernate las cambie.
spring.jpa.hibernate.ddl-auto=none
spring.sql.init.mode=never
spring.jpa.open-in-view=false

# Flyway revisa los cambios pendientes antes de iniciar la aplicación.
spring.flyway.enabled=true
spring.flyway.locations=classpath:base_datos/migraciones
spring.flyway.validate-on-migrate=true
spring.flyway.validate-migration-naming=true
spring.flyway.baseline-on-migrate=false
spring.flyway.clean-disabled=true

# La clave real solo se guarda en el entorno de cada computadora.
seguridad.jwt.clave=${JWT_CLAVE}
seguridad.jwt.minutos-vigencia=${JWT_MINUTOS_VIGENCIA:15}
seguridad.origenes-permitidos=${ORIGENES_PERMITIDOS:http://localhost:5173,http://127.0.0.1:5173}

# Google se habilita cuando cada entorno tiene un ID de cliente válido.
seguridad.google.cliente-id=${GOOGLE_CLIENTE_ID:}

# El correo se activa después de completar la cuenta del proveedor.
correo.habilitado=${CORREO_HABILITADO:false}
correo.servidor=${CORREO_SERVIDOR:}
correo.puerto=${CORREO_PUERTO:587}
correo.usuario=${CORREO_USUARIO:}
correo.contrasena=${CORREO_CONTRASENA:}
correo.remitente=${CORREO_REMITENTE:}
correo.ssl=${CORREO_SSL:false}
