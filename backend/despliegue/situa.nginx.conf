server {
    listen 80;
    server_name situa.oaxacoders.tech;
    location ^~ /.well-known/acme-challenge/ { root /var/www/situa-certificados; }
    location / { return 301 https://situa.oaxacoders.tech$request_uri; }
}
server {
    listen 443 ssl;
    server_name situa.oaxacoders.tech;
    ssl_certificate /etc/letsencrypt/live/situa.oaxacoders.tech/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/situa.oaxacoders.tech/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    root /opt/situa/actual/frontend;
    index index.html;
    client_max_body_size 1m;
    access_log /var/log/nginx/situa-acceso.log;
    error_log /var/log/nginx/situa-error.log;
    location /api/ {
        proxy_pass http://127.0.0.1:8095;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
        proxy_buffering off;
    }
    location / { try_files $uri $uri/ /index.html; }
}
