info:
  name: "Comprobar retiro del aviso"
  type: "http"
  seq: 71
http:
  method: "GET"
  url: "https://situa.oaxacoders.tech/api/tutor/avisos/pagina?pagina=1&tamano=5&busqueda={{marca}}"
  auth:
    type: "bearer"
    token: "{{token_tutor}}"
runtime:
  scripts:
    - type: "tests"
      code: |-
        test("Responde HTTP 200", function () {
          expect(res.status).to.equal(200);
        });
        test("El aviso retirado ya no aparece", function () { expect(res.body.totalRegistros).to.equal(0); });
settings:
  encodeUrl: true
  timeout: 30000
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
