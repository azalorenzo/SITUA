info:
  name: "Consultar horarios por intervalo"
  type: "http"
  seq: 44
http:
  method: "GET"
  url: "https://situa.oaxacoders.tech/api/tutor/horarios?desde={{desde_horarios}}&hasta={{hasta_horarios}}"
  auth:
    type: "bearer"
    token: "{{token_tutor}}"
runtime:
  scripts:
    - type: "tests"
      code: |-
        test("Responde HTTP 200", function () {
          expect(res.status).to.equal(200);
        });
        test("Incluye el horario creado", function () { expect(res.body.some(horario => horario.id === bru.getVar("horario_prueba"))).to.equal(true); });
settings:
  encodeUrl: true
  timeout: 30000
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
