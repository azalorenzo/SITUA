info:
  name: "Consultar conversaciones del tutor"
  type: "http"
  seq: 42
http:
  method: "GET"
  url: "https://situa.oaxacoders.tech/api/tutor/mensajes/conversaciones"
  auth:
    type: "bearer"
    token: "{{token_tutor}}"
runtime:
  scripts:
    - type: "tests"
      code: |-
        test("Responde HTTP 200", function () {
          expect(res.status).to.equal(200);
        });
        test("Devuelve una lista de conversaciones", function () { expect(res.body).to.be.an("array"); });
settings:
  encodeUrl: true
  timeout: 30000
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
