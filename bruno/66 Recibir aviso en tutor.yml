info:
  name: "Recibir aviso en tutor"
  type: "http"
  seq: 66
http:
  method: "GET"
  url: "https://situa.oaxacoders.tech/api/tutor/avisos/pagina?pagina=1&tamano=5&busqueda={{marca}}"
  auth:
    type: "bearer"
    token: "{{token_tutor}}"
runtime:
  scripts:
    - type: "tests"
      code: |-
        test("Responde HTTP 200", function () {
          expect(res.status).to.equal(200);
        });
        test("La página viene del servidor", function () {
          expect(res.body.contenido).to.be.an("array");
          expect(res.body.pagina).to.be.a("number");
          expect(res.body.totalRegistros).to.be.a("number");
          expect(res.body.totalPaginas).to.be.a("number");
        });
        test("El tutor recibe el aviso", function () { expect(res.body.contenido.some(aviso => aviso.id === bru.getVar("aviso_prueba"))).to.equal(true); });
settings:
  encodeUrl: true
  timeout: 30000
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
